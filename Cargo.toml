[package]
name = "data-over-sound"
version = "0.2.0"
edition = "2021"
description = "Data over sound: adaptive OFDM acoustic modem, network card over a speaker and a microphone"
license = "MIT"

[lib]
name = "dos"
path = "src/lib.rs"

[[bin]]
name = "dos"
path = "src/main.rs"

[dependencies]
realfft = "3.4"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
crc32fast = "1.4"
libc = "0.2"
base64 = "0.22"
anyhow = "1.0"

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
