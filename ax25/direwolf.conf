# Direwolf soft-TNC: AFSK through the laptop speaker + mic. @MODEM@ = "<baud> <mark>:<space>" from up.sh.
# @CALL@ is replaced by up.sh. KISS is exposed only on the pseudo-terminal (-p) for kissattach.
ADEVICE default
ARATE 48000
ACHANNELS 1

CHANNEL 0
MYCALL @CALL@
MODEM @MODEM@
# Carrier lead-in (x10 ms): audio stack + speaker amp need time to wake up
TXDELAY @TXDELAY@
TXTAIL 10
# p-persistent CSMA with wide random backoff: 1 s slots, transmit with p = 32/256 per slot.
# Both TCP ends back off identically and their retransmits fire together; Direwolf's defaults
# (100 ms slots, p = 1/4) let both start before either hears the other.
SLOTTIME 100
PERSIST 32
# FX.25: Reed-Solomon FEC wrapped around AX.25 frames, still decodable by plain AX.25 receivers
FX25TX 16

AGWPORT 0
KISSPORT 0
